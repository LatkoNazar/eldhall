[project]
name = "support-mcp-openapi"
version = "0.1.0"
description = "Eldhall OpenAPI -> reviewed manifest importer and scoped MCP sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = ["ruff==0.17.3"]

[project.scripts]
support-mcp-import = "support_mcp.import_openapi:main"
support-mcp-server = "support_mcp.server:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_mcp"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
