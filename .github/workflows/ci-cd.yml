name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, codex/node-backend]
  workflow_dispatch:
    inputs:
      operation:
        description: Run normal CI/deploy or inspect the existing deployment without changes
        type: choice
        required: false
        default: normal
        options:
          - normal
          - diagnose-deploy

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'diagnose-deploy'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'starter' }}
      PUBLIC_APP_URL: http://localhost:18001
      PUBLIC_UMAMI_SCRIPT_URL: ""
      PUBLIC_UMAMI_WEBSITE_ID: ""
      PUBLIC_UMAMI_DOMAINS: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Choose isolated CI project and image
        id: ci_project
        run: |
          source scripts/project.sh
          validate_project_name "$PROJECT_NAME"
          prefix=${PROJECT_NAME:0:46}
          run_key=$(printf '%s' "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum)
          echo "COMPOSE_PROJECT_NAME=${prefix%-}-ci-${run_key:0:12}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=$PROJECT_NAME:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$PROJECT_NAME-frontend:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "LANDING_IMAGE=$PROJECT_NAME-landing:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/frontend/package-lock.json
            apps/landing/package-lock.json
      - name: Install locked web dependencies
        # Frontend integration tests import the real landing module.
        run: |
          npm --prefix apps/frontend ci
          npm --prefix apps/landing ci
      - name: Check and build frontend
        working-directory: apps/frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Check and build landing
        working-directory: apps/landing
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Check and build Node API and worker
        working-directory: apps/api
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Test project isolation and deployment guards
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          node --test scripts/tests/*.test.mjs
          bash scripts/tests/test-release.sh
      - name: Validate production composition
        run: |
          docker compose --env-file .env.example -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose --env-file .env.example -f deploy/support.compose.yaml --profile ui config --quiet
          SUPPORT_CONFIG_PATH=../examples/support.config.json docker compose --env-file .env.example -f deploy/support.compose.yaml -f deploy/support.config.compose.yaml --profile ui config --quiet
          env -u POSTGRES_PASSWORD DATABASE_URL='postgresql://ci_user:synthetic@db.example.invalid:5432/existing_app?sslmode=verify-full' REDIS_PASSWORD=synthetic-redis-password API_TOKEN=synthetic-api-token OPERATOR_TOKEN=synthetic-operator-token docker compose --env-file /dev/null -f deploy/support.external-db.compose.yaml --profile ui config --quiet
          env -u POSTGRES_PASSWORD DATABASE_URL='postgresql://ci_user:synthetic@db.example.invalid:5432/existing_app?sslmode=verify-full' REDIS_PASSWORD=synthetic-redis-password API_TOKEN=synthetic-api-token OPERATOR_TOKEN=synthetic-operator-token SUPPORT_CONFIG_PATH=../examples/support.config.json docker compose --env-file /dev/null -f deploy/support.external-db.compose.yaml -f deploy/support.config.compose.yaml --profile ui config --quiet
      - name: Build application images
        run: |
          docker build --tag "$APP_IMAGE" apps/api
          docker build -f apps/frontend/Dockerfile --target production --tag "$FRONTEND_IMAGE" --build-arg PUBLIC_APP_URL --build-arg PUBLIC_UMAMI_SCRIPT_URL --build-arg PUBLIC_UMAMI_WEBSITE_ID --build-arg PUBLIC_UMAMI_DOMAINS .
          docker build -f apps/landing/Dockerfile --target production --tag "$LANDING_IMAGE" --build-arg PUBLIC_APP_URL --build-arg PUBLIC_UMAMI_SCRIPT_URL --build-arg PUBLIC_UMAMI_WEBSITE_ID --build-arg PUBLIC_UMAMI_DOMAINS .
      - name: Generate private CI configuration
        id: ci_environment
        run: python3 scripts/init-env.py --project-name "$PROJECT_NAME" --output .env.ci
      - name: Start dependencies and migrate
        run: |
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml up -d --wait --wait-timeout 180 postgres redis umami-db umami
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml run --rm --no-deps migrate
      - name: Start application and exercise real background job
        run: |
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml up -d --no-build --wait --wait-timeout 180 api worker frontend landing
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml exec -T -e SMOKE_BASE_URL=http://frontend:8080 -e SMOKE_HOST=localhost api node --input-type=module - < scripts/frontend-smoke.mjs
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml exec -T -e SMOKE_BASE_URL=http://frontend:8080 -e SMOKE_HOST=localhost api node --input-type=module - < apps/api/scripts/smoke.mjs
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml exec -T -e SMOKE_BASE_URL=http://landing:8080 api node --input-type=module - < scripts/landing-smoke.mjs
      - name: Verify isolated analytics ingestion and attribution
        run: docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml exec -T -e UMAMI_SMOKE_ALLOW_DEFAULT_CREDENTIALS=1 umami node - < scripts/analytics-smoke.mjs
      - name: Diagnostics
        if: failure() && steps.ci_project.outcome == 'success' && steps.ci_environment.outcome == 'success'
        run: |
          test -f .env.ci || exit 0
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml logs --tail 100
      - name: Clean CI environment
        if: always() && steps.ci_project.outcome == 'success'
        run: |
          if [[ "${{ steps.ci_environment.outcome }}" == "success" && -f .env.ci ]]; then
            trap 'rm -f -- .env.ci' EXIT
            docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml down --volumes
          fi

  integration:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'diagnose-deploy'
    # Real PostgreSQL (with pgvector) and the cross-language OpenAPI → MCP path: the unit job above
    # runs the support store in memory, so storage claims, recovery and the sidecar are verified here.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: development-only
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway service credentials for this job only; tests create and drop their own schemas.
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: app
      TEST_POSTGRES_USER: app
      TEST_POSTGRES_PASSWORD: development-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
      - name: Install locked dependencies
        run: |
          npm --prefix apps/api ci
          uv sync --locked --project apps/mcp-openapi
      - name: PostgreSQL store, recovery and insights
        working-directory: apps/api
        run: npm run test:postgres
      - name: pgvector knowledge persistence
        working-directory: apps/api
        run: node --import tsx --test tests/knowledge.test.ts
      - name: Python OpenAPI importer and MCP sidecar
        working-directory: apps/mcp-openapi
        run: uv run --locked python -m unittest discover -s tests -v
      - name: OpenAPI → MCP end to end (mock upstream, real sidecar)
        working-directory: apps/api
        run: npm run test:mcp-openapi

  sidecar-compose:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'diagnose-deploy'
    # The self-host support stack with the MCP sidecar overlay, as built images and containers: worker execution,
    # real DSH runtime (scripted model), PostgreSQL, Redis, sidecar and a synthetic Orders upstream.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      COMPOSE: docker compose --env-file .env.mcp-smoke -f deploy/support.compose.yaml -f deploy/support.config.compose.yaml -f deploy/support.mcp.compose.yaml -f deploy/smoke/support.mcp.smoke.compose.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Generate private smoke secrets
        run: |
          umask 077
          : > .env.mcp-smoke
          # The mask command must go to this step's stdout, not into a command substitution or the file.
          for name in POSTGRES_PASSWORD REDIS_PASSWORD API_TOKEN OPERATOR_TOKEN MCP_SERVICE_TOKEN MCP_UPSTREAM_TOKEN ORDERS_TEST_CONTROL_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> .env.mcp-smoke
          done
          {
            echo "PROJECT_NAME=mcp-smoke-$GITHUB_RUN_ID"
            echo "MCP_UPSTREAM_BASE_URL=http://orders-mock:8090"
            echo "MCP_MANIFEST_PATH=../examples/orders/manifest.json"
            echo "SUPPORT_CONFIG_PATH=$RUNNER_TEMP/support.smoke.json"
          } >> .env.mcp-smoke
          # Fail here, not later, if the file is not plain KEY=value lines.
          ! grep -qvE '^[A-Z_]+=[^[:space:]]+$' .env.mcp-smoke
      - name: Write the support config (no secrets; readable by the container user)
        id: smoke_env
        run: |
          node scripts/mcp-sidecar-smoke.mjs prepare --out "$RUNNER_TEMP/support.smoke.json" --url http://mcp-openapi:8000/mcp
          chmod 644 "$RUNNER_TEMP/support.smoke.json"
      - name: Validate composition
        run: $COMPOSE config --quiet
      - name: Build images
        run: $COMPOSE build api mcp-openapi
      - name: Start dependencies and migrate
        run: |
          $COMPOSE up -d --wait --wait-timeout 180 postgres redis
          $COMPOSE run --rm --no-deps migrate
      - name: Start API, worker, sidecar and fixtures
        run: $COMPOSE up -d --no-build --wait --wait-timeout 240 orders-mock fake-llm mcp-openapi api worker
      - name: Chat → MCP → upstream; ask → approve → execute
        run: |
          OPERATOR_TOKEN=$(sed -n 's/^OPERATOR_TOKEN=//p' .env.mcp-smoke) \
          ORDERS_TEST_CONTROL_TOKEN=$(sed -n 's/^ORDERS_TEST_CONTROL_TOKEN=//p' .env.mcp-smoke) \
          SMOKE_API_URL=http://127.0.0.1:18000 ORDERS_CONTROL_URL=http://127.0.0.1:18090 node scripts/mcp-sidecar-smoke.mjs run
      - name: Diagnostics
        if: failure() && steps.smoke_env.outcome == 'success'
        run: |
          $COMPOSE ps --all
          $COMPOSE logs --tail 150 api worker mcp-openapi orders-mock fake-llm
      - name: Clean smoke environment
        if: always() && hashFiles('.env.mcp-smoke') != ''
        run: |
          trap 'rm -f -- .env.mcp-smoke "$RUNNER_TEMP/support.smoke.json"' EXIT
          $COMPOSE down --volumes --remove-orphans || true

  deploy:
    needs: [check, integration, sidecar-compose]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation != 'diagnose-deploy')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          source scripts/project.sh
          validate_project_name "$PROJECT_NAME"
          DEPLOY_PATH=${DEPLOY_PATH:-/opt/apps/$PROJECT_NAME}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_PATH" != / ]]
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$PUBLIC_APP_URL" || { echo 'Set the public build-time PUBLIC_APP_URL repository variable.' >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Verify server access and matching architecture before build
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          runner_arch=$(uname -m)
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" bash -s -- "$DEPLOY_PATH" "$runner_arch" <<'REMOTE'
          set -euo pipefail
          root=$1
          runner_arch=$2
          server_arch=$(uname -m)
          [[ "$server_arch" == "$runner_arch" ]] || {
            echo "Architecture mismatch: runner=$runner_arch, server=$server_arch. Select a matching RUNNER_LABEL." >&2
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo 'Deployment user cannot access Docker without sudo.' >&2
            exit 1
          }
          docker compose version >/dev/null 2>&1 || {
            echo 'Docker Compose is unavailable for the deployment user.' >&2
            exit 1
          }
          [[ -d "$root" && -w "$root" ]] || {
            echo 'Deployment root must exist and be writable by the deployment user.' >&2
            exit 1
          }
          [[ -r "$root/.env" ]] || {
            echo 'Production .env is missing or unreadable by the deployment user.' >&2
            exit 1
          }
          [[ ! -e "$root/releases" || -w "$root/releases" ]] || {
            echo 'Release directory is not writable by the deployment user.' >&2
            exit 1
          }
          echo "Deployment preflight OK: $server_arch"
          REMOTE
      - name: Build immutable release image and bundle
        run: |
          docker build --tag "$PROJECT_NAME:$GITHUB_SHA" apps/api
          docker build -f apps/frontend/Dockerfile --target production --tag "$PROJECT_NAME-frontend:$GITHUB_SHA" --build-arg PUBLIC_APP_URL --build-arg PUBLIC_UMAMI_SCRIPT_URL --build-arg PUBLIC_UMAMI_WEBSITE_ID --build-arg PUBLIC_UMAMI_DOMAINS .
          docker build -f apps/landing/Dockerfile --target production --tag "$PROJECT_NAME-landing:$GITHUB_SHA" --build-arg PUBLIC_APP_URL --build-arg PUBLIC_UMAMI_SCRIPT_URL --build-arg PUBLIC_UMAMI_WEBSITE_ID --build-arg PUBLIC_UMAMI_DOMAINS .
          docker build --target production --tag "$PROJECT_NAME-mcp-openapi:$GITHUB_SHA" apps/mcp-openapi
          mkdir -p .deploy
          docker save "$PROJECT_NAME:$GITHUB_SHA" "$PROJECT_NAME-frontend:$GITHUB_SHA" "$PROJECT_NAME-landing:$GITHUB_SHA" "$PROJECT_NAME-mcp-openapi:$GITHUB_SHA" | gzip -1 > .deploy/image.tar.gz
          printf 'SUPPORT_SERVER_IMAGE=%s:%s\nSUPPORT_WEB_IMAGE=%s-frontend:%s\nSUPPORT_MCP_IMAGE=%s-mcp-openapi:%s\n' "$PROJECT_NAME" "$GITHUB_SHA" "$PROJECT_NAME" "$GITHUB_SHA" "$PROJECT_NAME" "$GITHUB_SHA" > support-images.env
          tar -czf .deploy/release.tar.gz compose.yaml compose.prod.yaml support-images.env infra scripts deploy examples/orders docs apps/api/scripts/smoke.mjs
      - name: Upload release and deploy
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$remote'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes .deploy/release.tar.gz .deploy/image.tar.gz "$target:$remote/"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "tar -xzf '$remote/release.tar.gz' -C '$remote' && bash '$remote/scripts/deploy.sh' '$DEPLOY_PATH' '$GITHUB_SHA' '$PROJECT_NAME'"
      - name: Check public HTTPS endpoint
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          export SMOKE_BASE_URL="${PUBLIC_URL%/}"
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 10 --max-time 15 "$SMOKE_BASE_URL/health/ready"
          SMOKE_HOST=$(python3 -c 'import os; from urllib.parse import urlsplit; print(urlsplit(os.environ["PUBLIC_URL"]).netloc)')
          export SMOKE_HOST
          node scripts/frontend-smoke.mjs
      - name: Check public landing endpoint
        if: vars.LANDING_PUBLIC_URL != ''
        env:
          SMOKE_BASE_URL: ${{ vars.LANDING_PUBLIC_URL }}
        run: node scripts/landing-smoke.mjs
      - name: Remove runner deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  diagnose-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose-deploy' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/finalize-openapi-todo')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure verified diagnostics SSH connection
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          source scripts/project.sh
          validate_project_name "$PROJECT_NAME"
          DEPLOY_PATH=${DEPLOY_PATH:-/opt/apps/$PROJECT_NAME}
          validate_deploy_root "$DEPLOY_PATH"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ && "$DEPLOY_PORT" -ge 1 && "$DEPLOY_PORT" -le 65535 ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Read deployment status without modifying the server
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" "python3 - '$DEPLOY_PATH' '$PROJECT_NAME'" < scripts/deploy-diagnostics.py
      - name: Remove runner diagnostics key
        if: always()
        run: rm -f ~/.ssh/deploy_key
