name: ${COMPOSE_PROJECT_NAME:-comp-prep}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-app}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-app}
  API_TOKEN: ${API_TOKEN:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-app: &app
  image: ${APP_IMAGE:-comp-prep:local}
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: never
  environment: *app-environment
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  networks: [backend]
  depends_on: *dependencies

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    networks: [backend]

  redis:
    image: redis:7.4.11-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-app}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    networks: [backend]

  api:
    <<: *app
    networks: [backend, edge]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app
    command: [celery, -A, 'app.core.celery_app:celery_app', worker, --loglevel=INFO, '--hostname=worker@%h', '--concurrency=${CELERY_CONCURRENCY:-2}']
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.core.celery_app:celery_app inspect ping --destination "worker@$${HOSTNAME}" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 120s

  migrate:
    <<: *app
    profiles: [tools]
    command: [uv, run, --no-sync, alembic, upgrade, head]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  backend:
  edge:
