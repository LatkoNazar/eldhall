name: ${PROJECT_NAME:-starter}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  API_TOKEN: ${API_TOKEN:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  BULLMQ_DB: ${BULLMQ_DB:-2}
  BULLMQ_PREFIX: ${BULLMQ_PREFIX:-node-bullmq}
  BULLMQ_QUEUE: ${BULLMQ_QUEUE:-jobs-transform-v1}
  BULLMQ_ATTEMPTS: ${BULLMQ_ATTEMPTS:-4}
  BULLMQ_BACKOFF_MS: ${BULLMQ_BACKOFF_MS:-1000}
  BULLMQ_RETENTION_COUNT: ${BULLMQ_RETENTION_COUNT:-1000}
  BULLMQ_COMPLETED_RETENTION_SECONDS: ${BULLMQ_COMPLETED_RETENTION_SECONDS:-3600}
  BULLMQ_FAILED_RETENTION_SECONDS: ${BULLMQ_FAILED_RETENTION_SECONDS:-86400}
  OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
  SUPPORT_STORE: ${SUPPORT_STORE:-memory}
  DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-rules}
  AGENT_RUNTIME: ${AGENT_RUNTIME:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-agent}
  CLASSIFICATION_MODEL: ${CLASSIFICATION_MODEL:-}
  CLASSIFICATION_TIMEOUT_MS: ${CLASSIFICATION_TIMEOUT_MS:-10000}
  KB_EMBEDDINGS_PROVIDER: ${KB_EMBEDDINGS_PROVIDER:-local}
  KB_EMBEDDINGS_MODEL: ${KB_EMBEDDINGS_MODEL:-}
  KB_URL_ALLOWLIST: ${KB_URL_ALLOWLIST:-[]}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  KB_EXTERNAL_EMBEDDING_API_KEY: ${KB_EXTERNAL_EMBEDDING_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app: &app
  image: ${APP_IMAGE:-${PROJECT_NAME:-starter}:local}
  build:
    context: ./apps/api
    dockerfile: Dockerfile
  pull_policy: never
  environment: *app-environment
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  networks: [backend]
  depends_on: *dependencies

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    networks: [backend]

  redis:
    image: redis:7.4.11-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    networks: [backend]

  api:
    <<: *app
    networks: [backend, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health/ready', {signal: AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app
    command: [node, dist/worker.js]
    healthcheck:
      test: [CMD, node, dist/scripts/worker-health.js]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 35s

  frontend:
    image: ${FRONTEND_IMAGE:-${PROJECT_NAME:-starter}-frontend:local}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:18001}
        PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
        PUBLIC_UMAMI_DOMAINS: ${PUBLIC_UMAMI_DOMAINS:-}
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/frontend-health']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    logging: *logging

  landing:
    image: ${LANDING_IMAGE:-${PROJECT_NAME:-starter}-landing:local}
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      target: production
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:18001}
        PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
        PUBLIC_UMAMI_DOMAINS: ${PUBLIC_UMAMI_DOMAINS:-}
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/landing-health']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    logging: *logging

  umami-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:?Set a separate URL-safe UMAMI_POSTGRES_PASSWORD}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks: [analytics]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging

  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:?Set UMAMI_POSTGRES_PASSWORD}@umami-db:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?Set a separate random UMAMI_APP_SECRET}
      HOSTNAME: 0.0.0.0
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [analytics, edge]
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
    logging: *logging

  migrate:
    <<: *app
    profiles: [tools]
    command: [node, dist/migrate.js]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  umami_postgres_data:

networks:
  backend:
  edge:
  analytics:
