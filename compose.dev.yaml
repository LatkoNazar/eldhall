services:
  frontend:
    read_only: false
    build:
      target: development
    command: [sh, -c, 'npm ci && npm run dev -- --host 0.0.0.0']
    environment:
      API_PROXY_TARGET: http://api:8000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
      PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
      PUBLIC_UMAMI_DOMAINS: ${PUBLIC_UMAMI_DOMAINS:-}
    ports:
      - "127.0.0.1:${FRONTEND_LOCAL_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages/analytics:/app/packages/analytics:ro
      - frontend_node_modules:/app/apps/frontend/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
  landing:
    read_only: false
    build:
      target: development
    command: [sh, -c, 'npm ci && npm run dev -- --host 0.0.0.0']
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
      PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
      PUBLIC_UMAMI_DOMAINS: ${PUBLIC_UMAMI_DOMAINS:-}
    ports:
      - "127.0.0.1:${LANDING_LOCAL_PORT:-5174}:5174"
    volumes:
      - ./apps/landing:/app/apps/landing
      - ./packages/analytics:/app/packages/analytics:ro
      - landing_node_modules:/app/apps/landing/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
  umami:
    ports:
      - "127.0.0.1:${UMAMI_LOCAL_PORT:-3001}:3000"
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_LOCAL_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_LOCAL_PORT:-15672}:15672"
  api:
    command: [uvicorn, 'app.main:app', --host, 0.0.0.0, --port, "8000", --reload, --reload-dir, /app/src]
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src:ro
  worker:
    volumes:
      - ./apps/api/src:/app/src:ro
  migrate:
    volumes:
      - ./apps/api/migrations:/app/migrations:ro
      - ./apps/api/src:/app/src:ro

volumes:
  frontend_node_modules:
  landing_node_modules:
